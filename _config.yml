# Site settings
title: Dex's blog 
description: "Musings of a computer scientist."
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://blog.dex.moe" # the base hostname & protocol for your site, e.g. http://example.com
github_username: dexhunter 
future: true
comment-support: utterances

# Build settings
markdown: kramdown
theme: minima 
utterances:
    repo: dexhunter/blog.dex.moe
    issue-term: pathname
    theme: github-light

# GoatCounter site code (the MYCODE in MYCODE.goatcounter.com). Powers the
# footer page-view counter; leave empty to disable.
goatcounter: "dexhunter"

# GA4 web stream for this blog (production only).
google_analytics: G-VZBYFXB76V
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  # - jekyll-last-modified-at
exclude:
  - Gemfile
  - Gemfile.lock
  - Makefile
  - easygen.py
  - vendor
  - README.md
